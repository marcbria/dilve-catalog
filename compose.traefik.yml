services:
  app:
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      # BASE_PATH debe venir SIN barra final desde .env (ej: /llibres/cataleg).
      # Traefik usa este valor tanto para PathPrefix como para stripprefix;
      # una barra final provocaría rutas inconsistentes y errores de MIME
      # en los módulos ES servidos por Nginx.
      - "traefik.http.routers.cataleg.rule=Host(`${BASE_URL:-localhost}`) && PathPrefix(`${BASE_PATH}`)"
      - "traefik.http.routers.cataleg.entrypoints=websecure"
      - "traefik.http.routers.cataleg.tls=true"
      - "traefik.http.routers.cataleg.tls.certresolver=leresolver"
      - "traefik.http.services.cataleg.loadbalancer.server.port=80"
      - "traefik.http.middlewares.strip-cataleg.stripprefix.prefixes=${BASE_PATH}"
      - "traefik.http.routers.cataleg.middlewares=strip-cataleg"
    ports: !reset []
    networks:
      - proxy

networks:
  proxy:
    external: true
