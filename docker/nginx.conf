server {
    listen 80;
    server_name _;   # Responde a cualquier nombre de dominio

    root /usr/share/nginx/html;
    index index.html;

    # ── Assets estáticos del frontend ─────────────────────────
    # Regex para que un .js/.css/.json ausente devuelva 404 real
    # (no index.html), evitando el error "disallowed MIME type
    # (text/html)" al cargar módulos ES.
    #
    # IMPORTANTE: esta regex se evalúa ANTES que las location de
    # prefijo normales. Por eso el bloque /data/ de abajo debe
    # llevar `^~` para saltársela.
    location ~* \.(?:js|mjs|css|json|map|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # ── Cubiertas servidas desde el volumen /data ────────────
    # `^~` fuerza a Nginx a NO evaluar la regex de estáticos
    # cuando el path empieza por /data/. Sin `^~`, la regex de
    # arriba captura /data/covers/foo.jpg y se pierde el alias
    # (buscaría en /usr/share/nginx/html/data/... → 404).
    #
    # `alias /data/` + `try_files $uri =404`:
    #   /data/covers/foo.jpg  ->  /data/covers/foo.jpg
    #   si no existe           ->  404 limpio (sin index.html)
    location ^~ /data/ {
        alias /data/;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # MIME explícito por si el nginx.conf global no carga
        # mime.types (red de seguridad, sin efectos negativos).
        types {
            image/jpeg  jpg jpeg;
            image/png   png;
            image/webp  webp;
            image/gif   gif;
            image/svg+xml svg;
        }
    }

    # ── Resto del sitio (HTML, etc.) ─────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }
}
